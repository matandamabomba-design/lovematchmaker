<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Match Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
       <video class="background-video" autoplay muted loop>
        <source src="love (2).mp4" type="video/mp4">
       </video>
       <div class="video-overlay"></div>
    <h1>LOVE MATCH MAKER</h1>
    <form id="matchForm">
       <div class="form-group"> 
        <label for="yourName">Your Name</label><br>
        <input type="text" id="yourName" placeholder="Enter Your Name" required><br>
       </div>

       <div class="form-group">
        <label for="partnersName">Your Partner's Name</label><br>
        <input type="text" id="partnersName" placeholder="Enter Your Partner's Name" required><br>
       </div> 
       <button type="submit">Click Here</button>
    </form>
    <p id="message"></p>
    <div id="bigHeart">💖</div>
    <script src="lm.js"></script>
</body>
</html>
